<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wyden — Editor de Questões ENADE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ui-bg:    #f4f3ef;
    --ui-white: #fff;
    --ui-border:#dedad2;
    --ui-muted: #9e9d97;
    --ui-dark:  #1a1a1a;
    --gold:     #b8960a;
    --red:      #c0392b;
    --radius:   6px;
  }

  body { font-family: Arial, Helvetica, sans-serif; background: var(--ui-bg); color: var(--ui-dark); min-height: 100vh; }

  /* ── TOPBAR ── */
  #topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--ui-dark);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 54px;
    border-bottom: 3px solid var(--gold); gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo-ui { font-family: 'Arial Black', Arial, sans-serif; font-weight: 900; font-size: 22px; letter-spacing: -1.5px; color: #fff; }
  .brand-sub { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #888; }
  .tab-btn {
    background: transparent; border: 1px solid #444; color: #aaa;
    padding: 5px 16px; border-radius: var(--radius); cursor: pointer;
    font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    transition: all .15s; font-family: Arial, sans-serif;
  }
  .tab-btn.active { background: var(--gold); border-color: var(--gold); color: #111; }
  .tab-btn:hover:not(.active) { border-color: #777; color: #ddd; }
  #btn-pdf {
    background: var(--gold); border: none; color: #111;
    padding: 6px 18px; border-radius: var(--radius); cursor: pointer;
    font-size: 12px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase;
    font-family: Arial, sans-serif; transition: opacity .15s; margin-left: 4px;
  }
  #btn-pdf:disabled { opacity: .5; cursor: not-allowed; }
  #btn-pdf:not(:disabled):hover { opacity: .85; }

  /* ── LAYOUT ── */
  #app { display: flex; height: calc(100vh - 54px); }

  /* ── EDITOR PANEL ── */
  #panel-editor {
    width: 520px; min-width: 420px; background: var(--ui-white);
    border-right: 1px solid var(--ui-border);
    overflow-y: auto; padding: 18px 16px 40px; flex-shrink: 0;
  }
  #panel-editor.hidden { display: none; }

  #header-config {
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    border-radius: var(--radius); padding: 10px 12px; margin-bottom: 18px;
  }
  #header-config label { display: block; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--ui-muted); margin-bottom: 5px; }
  #header-config input {
    width: 100%; border: 1px solid var(--ui-border); border-radius: 4px;
    padding: 6px 10px; font-size: 13px; font-weight: 700; font-family: Arial, sans-serif;
    background: var(--ui-white); color: var(--ui-dark); outline: none;
  }
  #header-config input:focus { border-color: var(--gold); }

  .q-card { border: 1px solid var(--ui-border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; background: var(--ui-white); box-shadow: 0 1px 6px rgba(0,0,0,.07); }
  .q-card-head { background: #f0ede6; border-bottom: 1px solid var(--ui-border); display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  .q-card-head input { flex: 1; border: none; background: transparent; font-size: 14px; font-weight: 700; font-family: Arial, sans-serif; color: var(--ui-dark); outline: none; }
  .btn-rm-q { background: none; border: none; color: var(--red); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 2px; opacity: .7; }
  .btn-rm-q:hover { opacity: 1; }
  .q-card-body { padding: 12px; }
  .field-label { display: block; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--ui-muted); margin-bottom: 5px; }
  textarea.ctx { width: 100%; resize: vertical; border: 1px solid var(--ui-border); border-radius: 4px; padding: 7px 9px; font-size: 12px; line-height: 1.6; font-family: Arial, sans-serif; color: var(--ui-dark); outline: none; min-height: 110px; }
  textarea.ctx:focus { border-color: var(--gold); }
  .items-section { margin-top: 12px; }
  .item-row { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
  .item-badge { min-width: 24px; height: 24px; background: var(--ui-dark); color: #fff; font-size: 11px; font-weight: 900; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: Arial, sans-serif; user-select: none; }
  .item-row input { flex: 1; border: 1px solid var(--ui-border); border-radius: 4px; padding: 5px 8px; font-size: 12px; font-family: Arial, sans-serif; color: var(--ui-dark); outline: none; }
  .item-row input:focus { border-color: var(--gold); }
  /* Header info fields */
  .hinfo-section { margin-bottom: 16px; }
  .hinfo-section-title {
    font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--ui-muted); margin-bottom: 8px; display: block;
    border-bottom: 1px solid var(--ui-border); padding-bottom: 5px;
  }
  .hinfo-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .hinfo-field { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .hinfo-field label { font-size: 10px; font-weight: 700; color: var(--ui-muted); letter-spacing: 0.5px; text-transform: uppercase; }
  .hinfo-field input {
    border: 1px solid var(--ui-border); border-radius: 4px;
    padding: 5px 8px; font-size: 12px; font-family: Arial, sans-serif;
    color: var(--ui-dark); outline: none; width: 100%;
    background: var(--ui-white);
  }
  .hinfo-field input:focus { border-color: var(--gold); }

  #btn-add-q { width: 100%; background: none; border: 2px dashed var(--gold); border-radius: var(--radius); color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: 0.5px; padding: 11px; cursor: pointer; font-family: Arial, sans-serif; text-transform: uppercase; margin-top: 4px; }
  #btn-add-q:hover { background: #fdf5d8; }

  /* ── PREVIEW PANEL ── */
  #panel-preview { flex: 1; overflow-y: auto; background: #b5b2aa; padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 28px; }

  /* ══════════════════════════════
     PÁGINA A4 — layout natural
     Sem altura fixa: o conteúdo
     empurra para baixo livremente.
     O preview mostra uma "página"
     por questão com sombra A4.
  ══════════════════════════════ */
  .page-a4 {
    width: 210mm;
    background: #fff;
    box-shadow: 0 4px 32px rgba(0,0,0,.28);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10pt;
    color: #121212;
    padding: 11mm 10mm 22mm 10mm;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  /* Cabeçalho */
  .doc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5mm; }
  .doc-header-title { font-weight: 700; font-size: 13.5pt; color: #121212; letter-spacing: -0.3px; line-height: 1; padding-top: 2px; }

  /* Campos de ID */
  .id-fields { margin-bottom: 4mm; }
  .id-row { display: flex; gap: 4px; margin-bottom: 4px; }
  .id-box { border: 1.5px solid #555; border-radius: 3px; padding: 5px 10px; font-size: 11pt; color: #414141; line-height: 1.4; min-height: 28px; }

  /* Barra de questão */
  .q-bar { background: #DFDFDF; border-radius: 4px; padding: 5px 10px 4px; font-weight: 700; font-size: 10pt; color: #121212; margin-bottom: 4mm; display: block; width: 100%; }

  /* Enunciado */
  .q-context { font-size: 9.5pt; line-height: 1.58; text-align: justify; color: #121212; margin-bottom: 3mm; }
  .q-context p { margin-bottom: 2.5mm; }
  .q-context p:last-child { margin-bottom: 0; }

  /* Itens */
  .q-items { margin-bottom: 4mm; }
  .q-item { font-size: 9.5pt; line-height: 1.5; color: #121212; margin-bottom: 1.5mm; }

  /* Linhas de resposta — altura fixa, sem flex:1 */
  .answer-area { border: 1px solid #aaa; }
  .answer-line { height: 6.5mm; border-bottom: 0.5px solid #ccc; }
  .answer-line:last-child { border-bottom: none; }

  /* Rodapé */
  .doc-footer { margin-top: 4mm; }
  .footer-line { width: 100%; height: 1px; background: #414141; margin-bottom: 2mm; }
  .footer-text { text-align: right; font-size: 8pt; color: #414141; }
  .footer-text strong { font-weight: 700; }

  /* Aviso de overflow */
  .overflow-warn { margin-top: 3mm; background: #fff3cd; border: 1px solid #f0ad4e; border-radius: 4px; padding: 4px 8px; font-size: 8pt; color: #856404; }

  /* scrollbar */
  #panel-editor::-webkit-scrollbar, #panel-preview::-webkit-scrollbar { width: 5px; }
  #panel-editor::-webkit-scrollbar-thumb, #panel-preview::-webkit-scrollbar-thumb { background: #d0cdc7; border-radius: 3px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">
    <span class="logo-ui">wyden</span>
    <span class="brand-sub">Editor de Questões</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="tab-btn active" id="tab-editor" onclick="setTab('editor')">✏ Editor</button>
    <button class="tab-btn" id="tab-preview" onclick="setTab('preview')">◎ Preview</button>
    <button id="btn-pdf" onclick="gerarPDF()">⬇ Gerar PDF</button>
  </div>
</div>

<div id="app">
  <div id="panel-editor">
    <div id="header-config">
      <label>Título do cabeçalho</label>
      <input type="text" id="input-header" value="QUESTÃO ENADE" oninput="renderPreview()">
    </div>

    <div class="hinfo-section">
      <span class="hinfo-section-title">Dados do cabeçalho</span>
      <div class="hinfo-row">
        <div class="hinfo-field" style="flex:2;">
          <label>Nome</label>
          <input type="text" id="hi-nome" placeholder="Nome do aluno" oninput="renderPreview()">
        </div>
        <div class="hinfo-field" style="flex:1;">
          <label>Matrícula</label>
          <input type="text" id="hi-matricula" placeholder="Matrícula" oninput="renderPreview()">
        </div>
      </div>
      <div class="hinfo-row">
        <div class="hinfo-field" style="flex:2;">
          <label>Disciplina</label>
          <input type="text" id="hi-disciplina" placeholder="Disciplina" oninput="renderPreview()">
        </div>
        <div class="hinfo-field" style="flex:1;">
          <label>Prof.</label>
          <input type="text" id="hi-prof" placeholder="Professor(a)" oninput="renderPreview()">
        </div>
      </div>
      <div class="hinfo-row">
        <div class="hinfo-field" style="flex:1.2;">
          <label>Unid.</label>
          <input type="text" id="hi-unid" placeholder="Unidade" oninput="renderPreview()">
        </div>
        <div class="hinfo-field" style="flex:0.8;">
          <label>Tur.</label>
          <input type="text" id="hi-tur" placeholder="Turma" oninput="renderPreview()">
        </div>
        <div class="hinfo-field" style="flex:0.8;">
          <label>Data</label>
          <input type="date" id="hi-data" oninput="renderPreview()">
        </div>
      </div>
    </div>

    <div id="questions-list"></div>
    <button id="btn-add-q" onclick="addQuestion()">+ Adicionar questão</button>
  </div>

  <div id="panel-preview">
    <div id="pages-container"></div>
  </div>
</div>

<script>

const ANSWER_LINES = 22;
const LABELS = ['a', 'b'];

let questions = [
  {
    id: 1,
    title: 'Questão 1',
    context: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.\n\nExcepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. Sed perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium. Considere a seguinte situação hipotética e faça o que se pede nos itens a seguir.',
    items: [
      'Lorem ipsum dolor sit amet, consectetur adipiscing elit.',
      'Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.'
    ]
  },
  {
    id: 2,
    title: 'Questão 2',
    context: 'Ut enim ad minima veniam, quis nostrum exercitationem ullam corporis suscipit laboriosam, nisi ut aliquid ex ea commodi consequatur. Quis autem vel eum iure reprehenderit qui in ea voluptate velit esse quam nihil molestiae consequatur, vel illum qui dolorem eum fugiat quo voluptas nulla pariatur.\n\nAt vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident. Considere a seguinte situação hipotética e faça o que se pede nos itens a seguir.',
    items: [
      'Ut labore et dolore magnam aliquam quaerat voluptatem.',
      'Quis autem vel eum iure reprehenderit qui voluptate velit.'
    ]
  }
];

let nextId = 3;

/* ── Helpers ── */
function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Tab switching ── */
function setTab(tab) {
  document.getElementById('panel-editor').classList.toggle('hidden', tab !== 'editor');
  document.getElementById('tab-editor').classList.toggle('active', tab === 'editor');
  document.getElementById('tab-preview').classList.toggle('active', tab === 'preview');
}

/* ── Question management ── */
function addQuestion() {
  questions.push({ id: nextId++, title: `Questão ${questions.length + 1}`, context: '', items: ['', ''] });
  render();
}
function removeQuestion(id) {
  if (questions.length === 1) return alert('A prova precisa de ao menos uma questão.');
  questions = questions.filter(q => q.id !== id);
  render();
}
function onTitleChange(id, val)    { questions.find(q => q.id === id).title = val;       renderPreview(); }
function onContextChange(id, val)  { questions.find(q => q.id === id).context = val;     renderPreview(); }
function onItemChange(qId, i, val) { questions.find(q => q.id === qId).items[i] = val;   renderPreview(); }

/* ── Render editor panel ── */
function renderEditor() {
  document.getElementById('questions-list').innerHTML = questions.map(q => `
    <div class="q-card">
      <div class="q-card-head">
        <input type="text" value="${escHtml(q.title)}" oninput="onTitleChange(${q.id}, this.value)">
        <button class="btn-rm-q" onclick="removeQuestion(${q.id})">×</button>
      </div>
      <div class="q-card-body">
        <label class="field-label">Contexto / Enunciado</label>
        <textarea class="ctx" rows="7" oninput="onContextChange(${q.id}, this.value)">${escHtml(q.context)}</textarea>
        <div class="items-section">
          <label class="field-label" style="margin-top:10px;">Itens da questão</label>
          ${q.items.map((item, ii) => `
            <div class="item-row">
              <span class="item-badge">${LABELS[ii].toUpperCase()}</span>
              <input type="text" value="${escHtml(item)}" placeholder="Texto do item ${LABELS[ii].toUpperCase()}" oninput="onItemChange(${q.id}, ${ii}, this.value)">
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

/* ── Read header info fields ── */
function getHeaderInfo() {
  const v = (id) => document.getElementById(id)?.value || '';
  const rawDate = v('hi-data');
  let dateStr = '';
  if (rawDate) {
    const [y, m, d] = rawDate.split('-');
    dateStr = `${d}/${m}/${y}`;
  }
  return {
    nome:       v('hi-nome'),
    matricula:  v('hi-matricula'),
    disciplina: v('hi-disciplina'),
    prof:       v('hi-prof'),
    unid:       v('hi-unid'),
    tur:        v('hi-tur'),
    data:       dateStr,
  };
}

/* ── Build page HTML (shared between preview and PDF) ── */
function buildPageHTML(q, qi, total, headerLabel, isPreview, hi) {
  const paras = q.context.split('\n\n').filter(p => p.trim());
  const parasHtml = paras.length
    ? paras.map(p => `<p>${escHtml(p)}</p>`).join('')
    : (isPreview ? '<p style="color:#bbb;font-style:italic;">Nenhum contexto inserido.</p>' : '');

  const itemsHtml = q.items.map((item, ii) =>
    `<div class="q-item">${LABELS[ii]}) ${escHtml(item)}</div>`
  ).join('');

  const linesHtml = Array(ANSWER_LINES).fill(0)
    .map(() => `<div class="answer-line"></div>`)
    .join('');

  const idBoxStyle = 'border:1.5px solid #555;border-radius:3px;padding:5px 10px;font-size:11pt;color:#414141;line-height:1.4;min-height:28px;';

  return `
    <div class="doc-top">
      ${WYDEN_SVG}
      <span class="doc-header-title">${escHtml(headerLabel)}</span>
    </div>
    <div class="id-fields">
      <div class="id-row">
        <span class="id-box" style="flex:2;${idBoxStyle}">Nome: <span style="font-weight:400;">${escHtml(hi.nome)}</span></span>
        <span class="id-box" style="flex:1;${idBoxStyle}">Matrícula: <span style="font-weight:400;">${escHtml(hi.matricula)}</span></span>
      </div>
      <div class="id-row">
        <span class="id-box" style="flex:2;${idBoxStyle}">Disciplina: <span style="font-weight:400;">${escHtml(hi.disciplina)}</span></span>
        <span class="id-box" style="flex:1;${idBoxStyle}">Prof.: <span style="font-weight:400;">${escHtml(hi.prof)}</span></span>
      </div>
      <div class="id-row">
        <span class="id-box" style="flex:1.2;${idBoxStyle}">Unid.: <span style="font-weight:400;">${escHtml(hi.unid)}</span></span>
        <span class="id-box" style="flex:0.8;${idBoxStyle}">Tur.: <span style="font-weight:400;">${escHtml(hi.tur)}</span></span>
        <span class="id-box" style="flex:0.8;${idBoxStyle}">Data: <span style="font-weight:400;">${escHtml(hi.data)}</span></span>
      </div>
    </div>
    <div class="q-bar">${escHtml(q.title)}</div>
    <div class="q-context">${parasHtml}</div>
    <div class="q-items">${itemsHtml}</div>
    <div class="answer-area">${linesHtml}</div>
    ${isPreview ? `
    <div class="doc-footer">
      <div class="footer-line"></div>
      <div class="footer-text">Página <strong>${qi + 1}</strong> de ${total}</div>
    </div>` : ''}
  `;
}

/* ── Render preview ── */
function renderPreview() {
  const headerLabel = document.getElementById('input-header').value;
  const total = questions.length;
  const hi = getHeaderInfo();
  const container = document.getElementById('pages-container');
  container.style.cssText = 'display:flex;flex-direction:column;gap:28px;align-items:center;';

  container.innerHTML = questions.map((q, qi) =>
    `<div class="page-a4" id="preview-page-${qi}">${buildPageHTML(q, qi, total, headerLabel, true, hi)}</div>`
  ).join('');
}

/* ════════════════════════════════════════════════════════
   GERAR PDF — jsPDF puro (texto vetorial, sem imagem)
   Todas as dimensões em mm. Página A4: 210 × 297 mm.
════════════════════════════════════════════════════════ */
function gerarPDF() {
  const btn = document.getElementById('btn-pdf');
  btn.textContent = '⏳ Gerando...';
  btn.disabled = true;

  try {
    const { jsPDF } = window.jspdf;
    const headerLabel = document.getElementById('input-header').value;
    const hi = getHeaderInfo();

    /* ── Constantes de layout ── */
    const PW = 210, PH = 297;          // página A4
    const ML = 10, MR = 10;            // margens esq/dir
    const MT = 11, MB = 14;            // margens top/bottom
    const CW = PW - ML - MR;           // largura do conteúdo (190mm)
    const LINE_H = 6.5;                // altura de cada linha de resposta (mm)
    const N_LINES = 22;                // número de linhas de resposta
    const BOX_H = 8;                   // altura das caixas de cabeçalho

    /* ── Helpers de texto com quebra automática ── */
    function wrappedText(pdf, text, x, maxW, fontSize, lineHeight) {
      pdf.setFontSize(fontSize);
      const lines = pdf.splitTextToSize(text, maxW);
      return { lines, height: lines.length * lineHeight };
    }

    function drawWrapped(pdf, lines, x, y, lineHeight) {
      lines.forEach((line, i) => pdf.text(line, x, y + i * lineHeight));
    }

    /* ── Desenha uma caixa de campo (label: valor) ── */
    function drawField(pdf, label, value, x, y, w, h) {
      pdf.setDrawColor(80, 80, 80);
      pdf.setLineWidth(0.3);
      pdf.rect(x, y, w, h);
      pdf.setFontSize(8);
      pdf.setTextColor(65, 65, 65);
      pdf.setFont('helvetica', 'bold');
      pdf.text(label, x + 2, y + 5.2);
      if (value) {
        pdf.setFont('helvetica', 'normal');
        pdf.setFontSize(9);
        pdf.setTextColor(18, 18, 18);
        const maxW = w - pdf.getTextWidth(label) - 4;
        const val = pdf.splitTextToSize(value, maxW)[0];
        pdf.text(val, x + 2 + pdf.getTextWidth(label) + 1, y + 5.2);
      }
    }

    /* ── Cabeçalho de campos de identificação ── */
    function drawIdFields(pdf, hi, y) {
      const h = BOX_H;
      const gap = 1;
      // Linha 1: Nome (2/3) | Matrícula (1/3)
      const w1a = CW * 2/3 - gap/2, w1b = CW * 1/3 - gap/2;
      drawField(pdf, 'Nome:', hi.nome, ML, y, w1a, h);
      drawField(pdf, 'Matrícula:', hi.matricula, ML + w1a + gap, y, w1b, h);
      y += h + gap;
      // Linha 2: Disciplina (2/3) | Prof. (1/3)
      drawField(pdf, 'Disciplina:', hi.disciplina, ML, y, w1a, h);
      drawField(pdf, 'Prof.:', hi.prof, ML + w1a + gap, y, w1b, h);
      y += h + gap;
      // Linha 3: Unid. | Tur. | Data
      const w3a = CW * 0.4, w3b = CW * 0.25 - gap, w3c = CW - w3a - w3b - gap*2;
      drawField(pdf, 'Unid.:', hi.unid, ML, y, w3a, h);
      drawField(pdf, 'Tur.:', hi.tur, ML + w3a + gap, y, w3b, h);
      drawField(pdf, 'Data:', hi.data, ML + w3a + w3b + gap*2, y, w3c, h);
      y += h;
      return y;
    }

    /* ── Barra "Questão N" ── */
    function drawQBar(pdf, title, y) {
      pdf.setFillColor(223, 223, 223);
      pdf.setDrawColor(223, 223, 223);
      pdf.roundedRect(ML, y, CW, 7, 1, 1, 'F');
      pdf.setFontSize(10);
      pdf.setFont('helvetica', 'bold');
      pdf.setTextColor(18, 18, 18);
      pdf.text(title, ML + 3, y + 5);
      return y + 7;
    }

    /* ── Logo "wyden" em texto (sem SVG) ── */
    function drawLogo(pdf, x, y) {
      pdf.setFontSize(22);
      pdf.setFont('helvetica', 'bold');
      pdf.setTextColor(0, 0, 0);
      pdf.text('wyden', x, y + 7);
    }

    /* ── Rodapé: linha + numeração ── */
    function drawFooter(pdf, pageNum, totalPages) {
      const y = PH - MB + 2;
      pdf.setDrawColor(65, 65, 65);
      pdf.setLineWidth(0.4);
      pdf.line(ML, y, PW - MR, y);
      pdf.setFontSize(8);
      pdf.setFont('helvetica', 'normal');
      pdf.setTextColor(65, 65, 65);
      const txt = `Página ${pageNum} de ${totalPages}`;
      pdf.text(txt, PW - MR - pdf.getTextWidth(txt), y + 4);
    }

    /* ── Calcula total de páginas antes de desenhar ── */
    // Para isso, simula o layout de cada questão e conta páginas necessárias
    function calcPages(q) {
      const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
      const { pageCount } = simulateQuestion(pdf, q, '', {}, false);
      return pageCount;
    }

    function simulateQuestion(pdf, q, headerLabel, hi, draw) {
      // Retorna { pageCount, pages: [{yStart, yEnd}] }
      const LH_BODY = 5.2;   // line-height corpo de texto
      const LH_ITEM = 5.0;   // line-height itens
      const FS_BODY = 9.5;

      pdf.setFont('helvetica', 'normal');

      // Conteúdo fixo por página de questão
      // Cabeçalho (logo+título): ~12mm
      // ID fields (3 linhas × BOX_H + gaps): 3*8 + 2 = 26mm
      // QBar: 7mm + 4mm gap = 11mm
      // Rodapé: MB = 14mm reservado
      const FIXED_TOP = 12 + 26 + 2 + 11; // mm do topo até início do texto
      const USABLE_H = PH - MT - MB - FIXED_TOP; // espaço para texto + linhas

      // Mede o enunciado
      pdf.setFontSize(FS_BODY);
      const paras = q.context.split('\n\n').filter(p => p.trim());
      let totalTextH = 0;
      const paraLines = paras.map(para => {
        const lines = pdf.splitTextToSize(para, CW);
        totalTextH += lines.length * LH_BODY + 2.5; // +gap entre parágrafos
        return lines;
      });
      if (paras.length) totalTextH -= 2.5; // remove último gap

      // Mede os itens
      const itemLines = q.items.map(item => {
        const txt = `${LABELS[q.items.indexOf(item)]}) ${item}`;
        return pdf.splitTextToSize(txt, CW);
      });
      let totalItemH = 0;
      itemLines.forEach(ls => totalItemH += ls.length * LH_ITEM + 1.5);

      const contentH = totalTextH + 4 + totalItemH + 4; // texto + margens internas
      const linesH = N_LINES * LINE_H;

      const totalContentH = contentH + linesH;

      // Quantas páginas são necessárias?
      // Primeira página: USABLE_H disponível
      // Páginas seguintes: PH - MT - MB
      const firstPageH = USABLE_H;
      const contPageH  = PH - MT - MB;

      let pages = 1;
      if (totalContentH > firstPageH) {
        const overflow = totalContentH - firstPageH;
        pages += Math.ceil(overflow / contPageH);
      }
      return { pageCount: pages, paraLines, itemLines, totalTextH, totalItemH, LH_BODY, LH_ITEM, FS_BODY };
    }

    /* ── Conta total de páginas ── */
    const pageCounts = questions.map(q => {
      const testPdf = new jsPDF({ unit: 'mm', format: 'a4' });
      return simulateQuestion(testPdf, q, headerLabel, hi, false).pageCount;
    });
    const totalPages = pageCounts.reduce((a, b) => a + b, 0);

    /* ── Desenha o PDF ── */
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    let globalPage = 0;

    questions.forEach((q, qi) => {
      if (qi > 0) pdf.addPage();
      globalPage++;

      const sim = simulateQuestion(pdf, q, headerLabel, hi, false);
      const { paraLines, itemLines, LH_BODY, LH_ITEM, FS_BODY } = sim;

      /* — Cabeçalho da página — */
      let y = MT;

      // Logo + título
      drawLogo(pdf, ML, y);
      pdf.setFontSize(13);
      pdf.setFont('helvetica', 'bold');
      pdf.setTextColor(18, 18, 18);
      const titleW = pdf.getTextWidth(headerLabel);
      pdf.text(headerLabel, PW - MR - titleW, y + 7);
      y += 12;

      // Campos de identificação
      y = drawIdFields(pdf, hi, y);
      y += 2;

      // Barra da questão
      y = drawQBar(pdf, q.title, y);
      y += 4;

      /* — Enunciado — */
      pdf.setFontSize(FS_BODY);
      pdf.setFont('helvetica', 'normal');
      pdf.setTextColor(18, 18, 18);

      paraLines.forEach((lines, pi) => {
        // Verifica quebra de página
        const blockH = lines.length * LH_BODY;
        if (y + blockH > PH - MB) {
          drawFooter(pdf, globalPage, totalPages);
          pdf.addPage();
          globalPage++;
          y = MT;
        }
        pdf.setFontSize(FS_BODY);
        pdf.setFont('helvetica', 'normal');
        drawWrapped(pdf, lines, ML, y, LH_BODY);
        y += blockH + (pi < paraLines.length - 1 ? 2.5 : 0);
      });

      y += 4;

      /* — Itens — */
      itemLines.forEach((lines, ii) => {
        const blockH = lines.length * LH_ITEM;
        if (y + blockH > PH - MB) {
          drawFooter(pdf, globalPage, totalPages);
          pdf.addPage();
          globalPage++;
          y = MT;
        }
        pdf.setFontSize(FS_BODY);
        pdf.setFont('helvetica', 'normal');
        pdf.setTextColor(18, 18, 18);
        const fullText = `${LABELS[ii]}) ${q.items[ii]}`;
        const wrapped = pdf.splitTextToSize(fullText, CW);
        drawWrapped(pdf, wrapped, ML, y, LH_ITEM);
        y += blockH + 1.5;
      });

      y += 4;

      /* — Linhas de resposta — */
      let isBoxStart = true; // controla se precisamos desenhar borda superior

      for (let l = 0; l < N_LINES; l++) {
        // Verifica quebra de página
        if (y + LINE_H > PH - MB) {
          // Fecha a borda inferior do segmento atual antes de quebrar
          pdf.setDrawColor(120, 120, 120);
          pdf.setLineWidth(0.3);
          pdf.line(ML, y, ML + CW, y); // borda inferior do segmento
          drawFooter(pdf, globalPage, totalPages);
          pdf.addPage();
          globalPage++;
          y = MT;
          isBoxStart = true; // nova página = novo segmento, precisa de borda superior
        }

        // Borda superior do segmento (primeira linha do box ou após quebra)
        if (isBoxStart) {
          pdf.setDrawColor(120, 120, 120);
          pdf.setLineWidth(0.3);
          pdf.line(ML, y, ML + CW, y); // topo
          isBoxStart = false;
        }

        // Bordas laterais da linha atual
        pdf.setDrawColor(120, 120, 120);
        pdf.setLineWidth(0.3);
        pdf.line(ML, y, ML, y + LINE_H);
        pdf.line(ML + CW, y, ML + CW, y + LINE_H);

        // Linha interna (separadora)
        const isLast = l === N_LINES - 1;
        pdf.setDrawColor(isLast ? 120 : 180, isLast ? 120 : 180, isLast ? 120 : 180);
        pdf.setLineWidth(isLast ? 0.3 : 0.15);
        pdf.line(ML, y + LINE_H, ML + CW, y + LINE_H);

        y += LINE_H;
      }

      drawFooter(pdf, globalPage, totalPages);
    });

    pdf.save('prova-enade.pdf');
  } catch (err) {
    alert('Erro ao gerar PDF: ' + err.message);
    console.error(err);
  } finally {
    btn.textContent = '⬇ Gerar PDF';
    btn.disabled = false;
  }
}

function render() { renderEditor(); renderPreview(); }
render();
</script>
