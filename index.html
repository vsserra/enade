<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wyden — Editor de Questões ENADE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="topbar">
  <div class="brand">
    <span class="logo-ui">wyden</span>
    <span class="brand-sub">Editor de Questões</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="tab-btn active" id="tab-editor" onclick="setTab('editor')">✏ Editor</button>
    <button class="tab-btn" id="tab-preview" onclick="setTab('preview')">◎ Preview</button>
    <button class="pdf-btn" id="btn-pdf" onclick="gerarPDFModelo()">⬇ Prova sem dados</button>
    <button class="pdf-btn" id="btn-pdf-students" onclick="gerarPDFAlunos()">⬇ Provas dos alunos</button>
  </div>
</div>

<div id="app">
  <div id="panel-editor">
    <div id="header-config">
      <label>Título do cabeçalho</label>
      <input type="text" id="input-header" value="QUESTÃO ENADE" oninput="renderPreview()">
    </div>

    <div class="hinfo-section">
      <span class="hinfo-section-title">Dados do cabeçalho</span>
      <div class="hinfo-row">
        <div class="hinfo-field" style="flex:2;">
          <label>Nome</label>
          <input type="text" id="hi-nome" placeholder="Nome do aluno" oninput="renderPreview()">
        </div>
        <div class="hinfo-field" style="flex:1;">
          <label>Matrícula</label>
          <input type="text" id="hi-matricula" placeholder="Matrícula" oninput="renderPreview()">
        </div>
      </div>
      <div class="hinfo-row">
        <div class="hinfo-field" style="flex:2;">
          <label>Disciplina</label>
          <input type="text" id="hi-disciplina" placeholder="Disciplina" oninput="renderPreview()">
        </div>
        <div class="hinfo-field" style="flex:1;">
          <label>Prof.</label>
          <input type="text" id="hi-prof" placeholder="Professor(a)" oninput="renderPreview()">
        </div>
      </div>
      <div class="hinfo-row">
        <div class="hinfo-field" style="flex:1.2;">
          <label>Unid.</label>
          <input type="text" id="hi-unid" placeholder="Unidade" oninput="renderPreview()">
        </div>
        <div class="hinfo-field" style="flex:0.8;">
          <label>Tur.</label>
          <input type="text" id="hi-tur" placeholder="Turma" oninput="renderPreview()">
        </div>
        <div class="hinfo-field" style="flex:0.8;">
          <label>Data</label>
          <input type="date" id="hi-data" oninput="renderPreview()">
        </div>
      </div>
    </div>

    <div class="hinfo-section">
      <span class="hinfo-section-title">Lista de alunos</span>
      <textarea class="students-box" id="students-list" placeholder="Um aluno por linha: Nome; Matrícula&#10;Ex.: Ana Silva; 2024001" oninput="onStudentsListChange()" onchange="onStudentsListChange()" onkeyup="onStudentsListChange()"></textarea>
      <div class="students-hint">Use um aluno por linha. Aceita separação por ponto e vírgula, vírgula, tabulação ou traço.</div>
      <div class="students-count" id="students-count">0 alunos na lista</div>
    </div>

    <div id="questions-list"></div>
    <button id="btn-add-q" onclick="addQuestion()">+ Adicionar questão</button>
  </div>

  <div id="panel-preview">
    <div id="pages-container"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
